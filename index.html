  quotes: ["What metaphors! / What coruscating, mincing fantasies!", "'Join us,' they shout. 'Oh God, child, you can't dance?'", "But I am dancing, look, from an old gibbet my bull-whipped body swings, a metronome!", "my mania, my mania is a terrible calm.", "some skull must rub its memory with ashes, some mind must squat down howling in your dust, some hand must crawl and recollect your rubbish, someone must write your poems."],
